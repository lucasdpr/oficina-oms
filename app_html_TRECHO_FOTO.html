<!-- ==============================================================
     ADICIONAR AO app.html — dentro do modal id="modal-intervencao"
     ==============================================================
     Onde colar: localize <div id="modal-intervencao" ...> no seu
     app.html. Dentro dele, ache o bloco do textarea (id="intervencao-texto")
     e cole os dois blocos abaixo:
       1) O seletor de CATEGORIA — cole ANTES do label "O QUE FOI FEITO?"
       2) O bloco de FOTO — cole DEPOIS do textarea, antes do botão
          "SALVAR INTERVENÇÃO"
     ============================================================== -->

<!-- 1) SELETOR DE CATEGORIA (colar antes do "O QUE FOI FEITO?") -->
<div style="margin-bottom: 16px;">
    <label style="display:block; font-size:0.75rem; font-weight:700; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase;">
        Categoria
    </label>
    <select id="intervencao-categoria" class="edit-input" style="width:100%; padding:10px; border-radius:8px; background:var(--bg-input); color:var(--text-heading); border:1px solid var(--border-color);">
        <option value="Intervenção">🔧 Intervenção</option>
        <option value="Melhoria">✨ Melhoria</option>
        <option value="Comentário">💬 Comentário</option>
        <option value="Atividade Pendente">⏳ Atividade Pendente</option>
    </select>
</div>

<!-- 2) ANEXAR/TIRAR FOTO (colar depois do textarea, antes do botão salvar) -->
<div style="margin-bottom: 16px;">
    <label style="display:block; font-size:0.75rem; font-weight:700; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase;">
        Foto (opcional)
    </label>

    <!-- capture="environment" abre a câmera traseira direto no celular.
         Sem "capture", em desktop abre o seletor de arquivos normal. -->
    <input
        type="file"
        id="intervencao-foto-input"
        accept="image/*"
        capture="environment"
        style="display:none;"
        onchange="window.processarFotoIntervencao(event)"
    >

    <button
        type="button"
        class="btn-premium"
        style="width:100%; justify-content:center; padding:10px;"
        onclick="document.getElementById('intervencao-foto-input').click()"
    >
        <i class="fas fa-camera"></i> Tirar Foto / Anexar
    </button>

    <!-- Preview da foto escolhida, com botão de remover -->
    <div id="intervencao-foto-preview-container" class="hidden" style="margin-top:10px; position:relative; display:inline-block;">
        <img id="intervencao-foto-preview" src="" style="max-width:100%; max-height:200px; border-radius:8px; border:1px solid var(--border-color);">
        <button
            type="button"
            onclick="window.removerFotoIntervencao()"
            style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer;"
        >
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>
